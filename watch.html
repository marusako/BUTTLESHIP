<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>AI Watch</title>
<!-- 開発用: AI 同士の試合を霧なしで早送りしながら観戦する (ルールの穴を探す)。配布しない -->
<style>
  :root{ --bg: #03060f; --panel: #0a1428; --line: #2a4a7a; --text: #d8e4ff; --muted: #7f93bb; --blue: #4fa3ff; --red: #ff5a5a; --accent: #ffd34f; }
  html, body{ margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
  #app{ position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 300px; }
  #view{ position: relative; min-width: 0; }
  canvas{ position: absolute; inset: 0; display: block; }
  #side{ background: var(--panel); border-left: 1px solid var(--line); padding: 12px; overflow-y: auto; }
  h1{ font-size: 16px; margin: 0 0 10px; color: var(--accent); }
  label{ display: block; margin: 8px 0 2px; color: var(--muted); font-size: 12px; }
  select, button{ font: inherit; color: var(--text); background: #0f2446; border: 1px solid var(--line); padding: 4px 8px; }
  button.on{ border-color: var(--accent); color: var(--accent); }
  .row{ display: flex; gap: 4px; flex-wrap: wrap; }
  .stat{ margin-top: 12px; line-height: 1.7; font-variant-numeric: tabular-nums; }
  .fl{ display: flex; justify-content: space-between; font-size: 13px; }
  .blue{ color: var(--blue); } .red{ color: var(--red); } .dead{ color: var(--muted); text-decoration: line-through; }
  .hint{ color: var(--muted); font-size: 12px; margin-top: 12px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <div id="view"><canvas id="c"></canvas></div>
  <div id="side">
    <h1>AI Watch (開発用)</h1>
    <label>青チームの AI</label><select id="blueAi"></select>
    <label>赤チームの AI</label><select id="redAi"></select>
    <label>速さ</label><div class="row" id="speeds"></div>
    <label>試合</label><div class="row"><button id="restart">新しい試合</button><button id="pause">一時停止</button></div>
    <label>表示</label><div class="row"><button id="showSensor" class="on">索敵範囲</button><button id="showOrders" class="on">命令</button></div>
    <div class="stat" id="stat"></div>
    <div class="hint" id="hint">ホイール: 拡大縮小 / ドラッグ: 視点移動 / ダブルクリック: 全体表示</div>
  </div>
</div>
<script src="logic.js"></script>
<script src="rule-ai.js"></script>
<script src="brain.js"></script>
<!-- 学習の途中経過 (npm run train が書き出す)。なければ「学習済み」は選べない -->
<script src="training/best-brains.js" onerror="window.SAGITTARIUS_TRAINING_BEST = null"></script>
<script>
'use strict';
const L = window.SagittariusLogic, R = window.SagittariusRuleAI, Br = window.SagittariusBrain;
const trained = window.SAGITTARIUS_TRAINING_BEST || null;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const COLORS = {blue: '#4fa3ff', red: '#ff5a5a', accent: '#ffd34f'};
const ROLE_MARK = {flagship: '旗', vice: '副', attacker: 'A', speeder: 'S'};
const DT = 1 / 60;

// mulberry32 (種が近くてもばらつく乱数)
function mulberry32(seed){ let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const AIS = {};
if(trained) AIS.trained = `学習済み (第 ${trained.generation} 世代)`;
AIS.rule = '旧ルール AI';
AIS.random = 'ランダムな脳 (学習前)';
for(const id of ['blueAi', 'redAi']){
  $(id).replaceChildren(...Object.entries(AIS).map(([k, v]) => { const o = document.createElement('option'); o.value = k; o.textContent = v; return o; }));
  $(id).value = trained ? 'trained' : 'rule';
  $(id).onchange = restart;
}
if(!trained) $('hint').textContent += ' / 学習済みの脳がまだありません (npm run train で作られます)';

let speed = 4, paused = false, showSensor = true, showOrders = true;
$('speeds').replaceChildren(...[1, 4, 16, 64].map(n => {
  const b = document.createElement('button'); b.textContent = `×${n}`; b.dataset.n = n;
  b.onclick = () => { speed = n; renderButtons(); }; return b;
}));
function renderButtons(){
  for(const b of $('speeds').children) b.classList.toggle('on', Number(b.dataset.n) === speed);
  $('pause').textContent = paused ? '再開' : '一時停止';
  $('showSensor').classList.toggle('on', showSensor);
  $('showOrders').classList.toggle('on', showOrders);
}
$('pause').onclick = () => { paused = !paused; renderButtons(); };
$('showSensor').onclick = () => { showSensor = !showSensor; renderButtons(); };
$('showOrders').onclick = () => { showOrders = !showOrders; renderButtons(); };
$('restart').onclick = restart;

function controllerOf(kind, rng){
  if(kind === 'trained') return Br.controller(Br.fromPlain(trained.brains));
  if(kind === 'random') return Br.controller(Br.randomBrainSet(rng));
  return R.controller();
}

let game, rng, seed = 1;
function restart(){
  seed = Math.floor(Math.random() * 2147483647);
  rng = mulberry32(seed);
  game = L.createGame(L.JOBS.balancer.params, {controllers: {blue: controllerOf($('blueAi').value, rng), red: controllerOf($('redAi').value, rng)}});
  for(const f of game.fleets) f.isPlayer = false;
}

// カメラ (全体表示から、ホイールで拡大、ドラッグで移動)
const cam = {cx: L.WORLD.w / 2, cy: L.WORLD.h / 2, scale: 1};
function fit(){ cam.cx = L.WORLD.w / 2; cam.cy = L.WORLD.h / 2; cam.scale = Math.min(canvas.width / L.WORLD.w, canvas.height / L.WORLD.h) * 0.95; }
function resize(){ canvas.width = $('view').clientWidth; canvas.height = $('view').clientHeight; }
// 画面の大きさが決まってから全体表示にする (大きさ 0 のうちに計算すると倍率が 0 になる)
let fitted = false;
new ResizeObserver(() => { resize(); if(!fitted && canvas.width > 0 && canvas.height > 0){ fit(); fitted = true; } }).observe($('view'));
resize();
const toS = (x, y) => ({x: canvas.width / 2 + (x - cam.cx) * cam.scale, y: canvas.height / 2 + (y - cam.cy) * cam.scale});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const wx = cam.cx + (mx - canvas.width / 2) / cam.scale, wy = cam.cy + (my - canvas.height / 2) / cam.scale;
  cam.scale *= e.deltaY < 0 ? 1.15 : 1 / 1.15;
  cam.cx = wx - (mx - canvas.width / 2) / cam.scale; cam.cy = wy - (my - canvas.height / 2) / cam.scale;
}, {passive: false});
let drag = null;
canvas.addEventListener('mousedown', e => { drag = {x: e.clientX, y: e.clientY}; });
window.addEventListener('mousemove', e => { if(!drag) return; cam.cx -= (e.clientX - drag.x) / cam.scale; cam.cy -= (e.clientY - drag.y) / cam.scale; drag = {x: e.clientX, y: e.clientY}; });
window.addEventListener('mouseup', () => { drag = null; });
canvas.addEventListener('dblclick', fit);

function draw(){
  ctx.fillStyle = '#03060f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const a = toS(0, 0), b = toS(L.WORLD.w, L.WORLD.h);
  ctx.strokeStyle = 'rgba(79, 163, 255, 0.5)'; ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
  const living = game.fleets.filter(f => f.ships > 0);
  if(showSensor){
    for(const f of living){
      const p = toS(f.x, f.y);
      ctx.strokeStyle = f.team === 'blue' ? 'rgba(79,163,255,0.25)' : 'rgba(255,90,90,0.25)';
      ctx.beginPath(); ctx.arc(p.x, p.y, L.SENSOR_RANGE * cam.scale, 0, Math.PI * 2); ctx.stroke();
    }
  }
  if(showOrders){
    for(const f of living){
      if(!f.order) continue;
      let d = f.order;
      if(d.type === 'attack'){ d = game.fleets.find(e => e.id === f.order.targetId); if(!d) continue; }
      const p = toS(f.x, f.y), q = toS(d.x, d.y);
      ctx.strokeStyle = f.order.type === 'attack' ? 'rgba(255,211,79,0.5)' : (f.team === 'blue' ? 'rgba(79,163,255,0.35)' : 'rgba(255,90,90,0.35)');
      ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  for(const pr of game.projectiles){
    const p = toS(pr.x, pr.y);
    ctx.fillStyle = pr.kind === 'shell' ? (pr.team === 'blue' ? '#a0d2ff' : '#ffa078') : '#fff3c4';
    const s = pr.kind === 'shell' ? 2 : 3.5; ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.textAlign = 'center'; ctx.font = '11px sans-serif';
  for(const f of game.fleets){
    const p = toS(f.x, f.y);
    const r = Math.max(4, (8 + 8 * f.ships / L.INITIAL_SHIPS) * Math.max(cam.scale * 8, 0.6));
    ctx.fillStyle = f.ships > 0 ? COLORS[f.team] : '#44506a';
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    if(f.flagship){ ctx.strokeStyle = COLORS.accent; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, r + 4, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1; }
    ctx.fillStyle = '#fff'; ctx.fillText(ROLE_MARK[f.role] || '?', p.x, p.y + 4);
  }
}

function renderStat(){
  const st = L.battleStats(game);
  const outcome = {win: '青の勝ち', lose: '赤の勝ち', draw: '引き分け'}[game.outcome] || '試合中';
  const rows = game.fleets.map(f => `<div class="fl ${f.ships > 0 ? f.team : 'dead'}"><span>${f.id} ${ROLE_MARK[f.role]}</span><span>${Math.ceil(f.ships)}</span></div>`).join('');
  $('stat').innerHTML = `<div>時間 ${Math.floor(st.time / 60)}:${String(Math.floor(st.time % 60)).padStart(2, '0')}  (種 ${seed})</div>
    <div><span class="blue">青 ${Math.ceil(st.ships.blue)} 隻 (${st.fleets.blue})</span> / <span class="red">赤 ${Math.ceil(st.ships.red)} 隻 (${st.fleets.red})</span></div>
    <div>${outcome}</div>${rows}`;
}

let last = 0;
function frame(now){
  const elapsed = Math.min(0.1, (now - last) / 1000 || 0);
  last = now;
  if(!paused && !game.outcome){
    const steps = Math.round(elapsed * speed / DT);
    for(let i = 0; i < steps && !game.outcome; i++) L.step(game, DT, rng);
  }
  draw();
  renderStat();
  requestAnimationFrame(frame);
}
restart();
renderButtons();
requestAnimationFrame(frame);
</script>
</body>
</html>
